<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>

  <style>
    :root {
      --bg: #eaf7ff;
      --bg-soft: #f5fbff;
      --panel: #ffffff;
      --text: #16405c;
      --muted: #5b7c92;
      --line: #cfe8f7;
      --primary: #38a7f3;
      --primary-strong: #1f8ddd;
      --primary-soft: #e1f3ff;
      --highlight: #fff2a8;
      --shadow: 0 12px 28px rgba(56, 167, 243, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        Arial,
        sans-serif;
      background:
        linear-gradient(180deg, #dff4ff 0%, #eef9ff 35%, #f7fcff 100%);
      color: var(--text);
    }

    .container {
      width: min(980px, calc(100% - 32px));
      margin: 36px auto 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 20px;
      align-items: center;
      background: linear-gradient(135deg, #ffffff 0%, #f0faff 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
      overflow: hidden;
      position: relative;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(56, 167, 243, 0.08);
      pointer-events: none;
    }

    .hero::before {
      width: 180px;
      height: 180px;
      right: -50px;
      top: -50px;
    }

    .hero::after {
      width: 120px;
      height: 120px;
      left: -35px;
      bottom: -35px;
    }

    .hero-text {
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .mascot-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      border-radius: 22px;
      background: linear-gradient(180deg, #dbf2ff 0%, #f5fcff 100%);
      border: 1px solid #d2edff;
      padding: 12px;
    }

    .mascot-note {
      margin-top: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .search-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      height: 48px;
      border: 1px solid #bfe2f6;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--text);
      background: #fbfeff;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 167, 243, 0.14);
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .reset-button {
      min-width: 92px;
      height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      background: linear-gradient(180deg, #49b4fb 0%, #2f9be7 100%);
      color: white;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(47, 155, 231, 0.22);
    }

    .reset-button:hover {
      filter: brightness(0.98);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .filter-button {
      padding: 9px 14px;
      border-radius: 999px;
      background: #f3fbff;
      color: #397190;
      font-weight: 700;
      border: 1px solid #d5edf9;
    }

    .filter-button:hover {
      background: #e8f7ff;
    }

    .filter-button.active {
      background: var(--primary-soft);
      color: var(--primary-strong);
      border-color: #a9dbfb;
    }

    .result-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 2px 12px;
    }

    .result-count {
      font-weight: 800;
      font-size: 16px;
    }

    .result-count span {
      color: var(--primary-strong);
    }

    .result-list {
      display: grid;
      gap: 12px;
    }

    .faq-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .category-badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef9ff;
      color: #357aa1;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #d8eefb;
    }

    .question {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }

    .answer {
      margin: 0;
      color: #4d6d81;
      line-height: 1.7;
    }

    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty-state {
      background: var(--panel);
      border: 1px dashed #b7def4;
      border-radius: 16px;
      padding: 44px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      margin-bottom: 8px;
      font-size: 18px;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }
    }

    @media (max-width: 640px) {
      .container {
        margin: 24px auto 40px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .reset-button {
        width: 100%;
      }

      .faq-card {
        padding: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-text">
        <div class="hero-badge">업무 FAQ 검색 도우미</div>
        <h1>업무 FAQ 검색</h1>
        <p class="subtitle">
          질문이나 키워드를 입력해 필요한 FAQ를 빠르게 찾아보세요.<br />
          교육 / 문서 / IT / 보안 카테고리를 한 번에 검색할 수 있습니다.
        </p>
      </div>

      <div>
        <div class="mascot-card" aria-hidden="true">
          <!-- 공식 캐릭터를 그대로 복제하지 않고, 하늘색 톤의 오리지널 원정대 느낌 마스코트 SVG -->
          <svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="112" cy="196" rx="56" ry="12" fill="#CDEEFF"/>
            <circle cx="110" cy="78" r="44" fill="#57BDF7"/>
            <circle cx="94" cy="72" r="5" fill="#184766"/>
            <circle cx="126" cy="72" r="5" fill="#184766"/>
            <path d="M95 91C101 98 119 98 125 91" stroke="#184766" stroke-width="4" stroke-linecap="round"/>
            <circle cx="76" cy="58" r="10" fill="#8ED6FF"/>
            <path d="M72 46C80 34 96 28 110 28C124 28 140 34 148 46" stroke="#2A9EE9" stroke-width="10" stroke-linecap="round"/>
            <path d="M81 50H139V58C139 63.5228 134.523 68 129 68H91C85.4772 68 81 63.5228 81 58V50Z" fill="#F9C74F"/>
            <rect x="74" y="119" width="72" height="56" rx="24" fill="#57BDF7"/>
            <rect x="95" y="119" width="30" height="56" rx="15" fill="#41AFEF"/>
            <path d="M74 136L56 152" stroke="#57BDF7" stroke-width="14" stroke-linecap="round"/>
            <path d="M146 136L164 122" stroke="#57BDF7" stroke-width="14" stroke-linecap="round"/>
            <path d="M84 176L75 198" stroke="#57BDF7" stroke-width="14" stroke-linecap="round"/>
            <path d="M136 176L145 198" stroke="#57BDF7" stroke-width="14" stroke-linecap="round"/>
            <circle cx="165" cy="118" r="20" fill="#FFF5C4" stroke="#F4C542" stroke-width="4"/>
            <path d="M165 104V132" stroke="#F4C542" stroke-width="4" stroke-linecap="round"/>
            <path d="M151 118H179" stroke="#F4C542" stroke-width="4" stroke-linecap="round"/>
            <path d="M58 149C70 148 80 158 80 170" stroke="#2A9EE9" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/>
          </svg>
        </div>
        <div class="mascot-note">
          상단 캐릭터는 공식 블루원정대의 직접 복제가 아닌,<br />
          하늘색 분위기의 오리지널 마스코트입니다.
        </div>
      </div>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          aria-label="FAQ 검색어"
        />

        <button id="showAllButton" class="reset-button" type="button">
          전체보기
        </button>
      </div>

      <div id="filters" class="filters" aria-label="분류 필터">
        <button class="filter-button active" data-category="전체" type="button">전체</button>
        <button class="filter-button" data-category="교육" type="button">교육</button>
        <button class="filter-button" data-category="문서" type="button">문서</button>
        <button class="filter-button" data-category="IT" type="button">IT</button>
        <button class="filter-button" data-category="보안" type="button">보안</button>
      </div>
    </section>

    <section aria-live="polite">
      <div class="result-toolbar">
        <div class="result-count">검색 결과 <span id="resultCount">0</span>건</div>
      </div>
      <div id="resultList" class="result-list"></div>
    </section>
  </main>

  <script>
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer_seed: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer_seed: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer_seed: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer_seed: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer_seed: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const filters = document.getElementById("filters");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const showAllButton = document.getElementById("showAllButton");

    let selectedCategory = "전체";

    function escapeHtml(text) {
      return text.replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char]));
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmedKeyword = keyword.trim();

      if (!trimmedKeyword) return safeText;

      const regex = new RegExp(`(${escapeRegExp(trimmedKeyword)})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredData() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter(item => {
        const matchesCategory = selectedCategory === "전체" || item.category === selectedCategory;

        const searchableText = `${item.question} ${item.answer_seed} ${item.category}`.toLowerCase();
        const matchesKeyword = keyword === "" || searchableText.includes(keyword);

        return matchesCategory && matchesKeyword;
      });
    }

    function render() {
      const keyword = searchInput.value.trim();
      const filtered = getFilteredData();
      resultCount.textContent = filtered.length;

      if (filtered.length === 0) {
        resultList.innerHTML = `
          <div class="empty-state">
            <strong>검색 결과가 없습니다.</strong>
            첨부된 FAQ 데이터 안에서 다른 키워드나 분류를 선택해 보세요.
          </div>
        `;
        return;
      }

      resultList.innerHTML = filtered.map(item => `
        <article class="faq-card">
          <div class="category-badge">${highlight(item.category, keyword)}</div>
          <h2 class="question">${highlight(item.question, keyword)}</h2>
          <p class="answer">${highlight(item.answer_seed, keyword)}</p>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);

    filters.addEventListener("click", event => {
      const button = event.target.closest(".filter-button");
      if (!button) return;

      selectedCategory = button.dataset.category;

      document.querySelectorAll(".filter-button").forEach(btn => {
        btn.classList.toggle("active", btn === button);
      });

      render();
    });

    showAllButton.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";

      document.querySelectorAll(".filter-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.category === "전체");
      });

      render();
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
