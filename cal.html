<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG 맞춤형 대출 상환 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mgBlue: '#0052A5',
            mgDarkBlue: '#003875',
            mgLight: '#E8F1FB',
            mgAccent: '#0088FF',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    input[type=range] {
      accent-color: #0052A5;
    }
    /* Custom Scrollbar for Schedule Table */
    .table-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .table-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .table-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .table-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-3 sm:px-6">

  <!-- Main Container -->
  <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
    
    <!-- Header -->
    <header class="bg-mgBlue text-white py-6 px-6 text-center relative overflow-hidden">
      <!-- Background subtle decorative elements -->
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="absolute -left-6 -top-6 w-32 h-32 bg-blue-400/20 rounded-full blur-xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-5 relative z-10">
        <!-- Cute MG Bluebird Character SVG (restored!) -->
        <div class="w-16 h-16 md:w-20 md:h-20 flex-shrink-0 drop-shadow-lg transform hover:scale-105 hover:rotate-3 transition-transform duration-300 cursor-pointer" title="MG 블루버드">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Feet -->
            <path d="M42 82 L38 92 M42 82 L42 93 M42 82 L46 92" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
            <path d="M58 82 L54 92 M58 82 L58 93 M58 82 L62 92" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
            <!-- Body -->

            <!-- Belly -->
            <ellipse cx="50" cy="58" rx="20" ry="18" fill="#E8F1FB"/>
            <!-- Wings -->
            <path d="M22 52 C12 40 10 28 20 25 C28 22 30 38 28 52 Z" fill="#003875"/>
            <path d="M78 52 C88 40 90 28 80 25 C72 22 70 38 72 52 Z" fill="#003875"/>
            <!-- MG Green Leaf Crest -->
            <path d="M50 20 C42 8 58 6 52 20 Z" fill="#22C55E"/>
            <path d="M48 22 C38 12 50 10 46 22 Z" fill="#16A34A"/>
            <!-- Eyes -->
            <circle cx="40" cy="42" r="5" fill="#1E293B"/>
            <circle cx="60" cy="42" r="5" fill="#1E293B"/>
            <circle cx="42" cy="40" r="2" fill="white"/>
            <circle cx="62" cy="40" r="2" fill="white"/>
            <!-- Cheek Blush -->
            <ellipse cx="32" cy="48" rx="4" ry="2.5" fill="#F43F5E" opacity="0.6"/>
            <ellipse cx="68" cy="48" rx="4" ry="2.5" fill="#F43F5E" opacity="0.6"/>
            <!-- Beak -->
            <polygon points="45,46 55,46 50,54" fill="#F59E0B"/>
            <!-- Mini Calculator held by bird -->
            <g transform="translate(62, 55) rotate(12)">
              <rect x="0" y="0" width="20" height="26" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
              <rect x="2.5" y="3" width="15" height="6" rx="1" fill="#A7F3D0"/>
              <rect x="2.5" y="11" width="3.5" height="3.5" rx="0.5" fill="#3B82F6"/>
              <rect x="7.5" y="11" width="3.5" height="3.5" rx="0.5" fill="#3B82F6"/>
              <rect x="12.5" y="11" width="5" height="3.5" rx="0.5" fill="#EF4444"/>
              <rect x="2.5" y="16" width="3.5" height="3.5" rx="0.5" fill="#94A3B8"/>
              <rect x="7.5" y="16" width="3.5" height="3.5" rx="0.5" fill="#94A3B8"/>
              <rect x="12.5" y="16" width="5" height="3.5" rx="0.5" fill="#10B981"/>
              <rect x="2.5" y="21" width="3.5" height="3.5" rx="0.5" fill="#94A3B8"/>
              <rect x="7.5" y="21" width="3.5" height="3.5" rx="0.5" fill="#94A3B8"/>
              <rect x="12.5" y="21" width="5" height="3.5" rx="0.5" fill="#F59E0B"/>
            </g>
          </svg>
        </div>
        <div class="text-center sm:text-left">
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight">MG 맞춤형 대출 상환 계산기</h1>
          <p class="text-blue-100 text-sm mt-1">빠르고 정확한 새마을금고 스마트 금융 서비스</p>

                   <!-- 홈버튼 -->
                    <div style="text-align: left; padding: -20px;">
                        <a href="index.html" style="display: inline-block; padding: -10px -20px; background-color: #4CAF50; color: white; text-decoration: none; font-weight: bold; border-radius: 5px;">🧮 홈으로 가기</a>
                    </div>
                    <!-- 홈버튼 -->
          
        </div>
      </div>
    </header>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
      
      <!-- Left Column: Inputs (5 cols) -->
      <div class="lg:col-span-5 space-y-6 bg-slate-50 p-5 rounded-xl border border-gray-200">
        
        <!-- 대출 금액 -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-sm font-bold text-gray-700">대출 금액</label>
            <span id="korean-amount" class="text-xs font-bold text-mgBlue bg-blue-50 px-2 py-0.5 rounded border border-blue-100">500만 원</span>
          </div>
          <div class="relative flex items-center mb-2">
            <input type="number" id="input-amount" value="500" step="10" min="0"
                   class="w-full border border-gray-300 rounded-lg py-3 pl-4 pr-16 text-right text-lg font-bold focus:ring-2 focus:ring-mgBlue focus:border-mgBlue outline-none transition-all">
            <span class="absolute right-4 text-gray-500 font-medium pointer-events-none">만원</span>
          </div>
          <!-- Quick Amount Buttons -->
          <div class="grid grid-cols-4 gap-1.5">
            <button type="button" onclick="setQuickAmount(100)" class="py-2 bg-mgLight text-mgBlue font-semibold rounded-md hover:bg-blue-100 transition-colors text-xs">100만</button>
            <button type="button" onclick="setQuickAmount(500)" class="py-2 bg-mgLight text-mgBlue font-semibold rounded-md hover:bg-blue-100 transition-colors text-xs">500만</button>
            <button type="button" onclick="setQuickAmount(1000)" class="py-2 bg-mgLight text-mgBlue font-semibold rounded-md hover:bg-blue-100 transition-colors text-xs">1,000만</button>
            <button type="button" onclick="resetAmount()" class="py-2 bg-slate-200 text-slate-700 font-semibold rounded-md hover:bg-slate-300 transition-colors text-xs">초기화</button>
          </div>
        </div>

        <!-- 대출 기간 -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-bold text-gray-700">대출 기간</label>
            <div class="flex rounded-lg border border-gray-300 overflow-hidden text-xs font-semibold">
              <button type="button" id="btn-term-month" onclick="setTermUnit('month')" class="px-3 py-1 bg-white text-gray-600 hover:bg-gray-50">개월</button>
              <button type="button" id="btn-term-year" onclick="setTermUnit('year')" class="px-3 py-1 bg-mgBlue text-white">년</button>
            </div>
          </div>
          <div class="relative flex items-center mb-2">
            <input type="number" id="input-term" value="2" min="1" max="50"
                   class="w-full border border-gray-300 rounded-lg py-3 pl-4 pr-16 text-right text-lg font-bold focus:ring-2 focus:ring-mgBlue focus:border-mgBlue outline-none transition-all">
            <span class="absolute right-4 text-gray-500 font-medium pointer-events-none" id="label-term-unit">년</span>
          </div>
          <input type="range" id="slider-term" min="1" max="50" value="2" class="w-full cursor-pointer mb-2">
          <!-- Quick Term Buttons -->
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="setQuickTerm(5)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">5년</button>
            <button type="button" onclick="setQuickTerm(10)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">10년</button>
            <button type="button" onclick="setQuickTerm(20)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">20년</button>
          </div>
        </div>

        <!-- 연 이자율 -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">연 이자율</label>
          <div class="relative flex items-center mb-2">
            <input type="number" id="input-rate" value="5.5" step="0.1" min="0.1" max="24"
                   class="w-full border border-gray-300 rounded-lg py-3 pl-4 pr-12 text-right text-lg font-bold focus:ring-2 focus:ring-mgBlue focus:border-mgBlue outline-none transition-all">
            <span class="absolute right-4 text-gray-500 font-medium pointer-events-none">%</span>
          </div>
          <input type="range" id="slider-rate" min="0.1" max="20" step="0.1" value="5.5" class="w-full cursor-pointer mb-2">
          <!-- Quick Rate Buttons -->
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="setQuickRate(3.5)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">3.5%</button>
            <button type="button" onclick="setQuickRate(5.0)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">5.0%</button>
            <button type="button" onclick="setQuickRate(7.5)" class="py-1.5 bg-mgLight text-mgBlue font-semibold rounded-md border border-blue-100 hover:bg-blue-100 transition-colors text-xs">7.5%</button>
          </div>
        </div>

        <!-- 상환 방식 -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">상환 방식</label>
          <div class="grid grid-cols-3 gap-2 p-1 bg-gray-200/70 rounded-xl">
            <button type="button" id="type-equal-pi" onclick="setRepayType('equal-pi')"
                    class="py-2.5 px-1 text-xs sm:text-sm font-bold rounded-lg transition-all bg-mgBlue text-white shadow-sm">
              원리금균등
            </button>
            <button type="button" id="type-equal-p" onclick="setRepayType('equal-p')"
                    class="py-2.5 px-1 text-xs sm:text-sm font-bold rounded-lg transition-all text-gray-700 hover:text-gray-900 hover:bg-white shadow-sm">
              원금균등
            </button>
            <button type="button" id="type-bullet" onclick="setRepayType('bullet')"
                    class="py-2.5 px-1 text-xs sm:text-sm font-bold rounded-lg transition-all text-gray-700 hover:text-gray-900 hover:bg-white shadow-sm">
              만기일시
            </button>
          </div>
          <p id="repay-desc" class="text-xs text-gray-500 mt-2 px-1">매월 원금과 이자의 합계액을 동일하게 상환하는 방식입니다.</p>
        </div>

        <!-- 전체 조건 초기화 버튼 (새로 추가됨!) -->
        <div class="pt-2">
          <button type="button" onclick="resetAll()" 
                  class="w-full py-3 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition-colors text-sm flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            전체 조건 초기화
          </button>
        </div>

      </div>

      <!-- Right Column: Results & Schedule (7 cols) -->
      <div class="lg:col-span-7 flex flex-col space-y-5">
        
        <!-- Summary Card -->
        <div class="bg-mgLight/60 rounded-xl p-5 border border-blue-100 flex flex-col justify-between">
          <div class="flex items-center gap-2 text-mgBlue font-bold text-sm mb-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            <span>상환 요약 정보</span>
          </div>

          <!-- Highlight: 1st Month Payment -->
          <div class="bg-white p-4 rounded-lg border border-blue-100 shadow-sm mb-4">
            <div class="text-xs text-gray-500 font-medium">1회차 월 상환금</div>
            <div class="text-2xl sm:text-3xl font-extrabold text-mgBlue mt-1" id="res-first-payment">0 원</div>
          </div>

          <!-- Total Interest & Total Payment Grid -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/80 p-3 rounded-lg border border-gray-100">
              <div class="text-xs text-gray-500">총 대출 이자</div>
              <div class="text-base sm:text-lg font-bold text-gray-800 mt-0.5" id="res-total-interest">0 원</div>
            </div>
            <div class="bg-white/80 p-3 rounded-lg border border-gray-100">
              <div class="text-xs text-gray-500">총 상환 금액 (원금+이자)</div>
              <div class="text-base sm:text-lg font-bold text-gray-800 mt-0.5" id="res-total-payment">0 원</div>
            </div>
          </div>
        </div>

        <!-- Schedule Table Section -->
        <div class="flex-1 flex flex-col min-h-[300px] bg-white rounded-xl border border-gray-200 overflow-hidden">
          <div class="px-4 py-3 bg-slate-50 border-b border-gray-200 flex justify-between items-center">
            <h3 class="text-sm font-bold text-gray-800">회차별 상환 스케줄</h3>
            <span class="text-[10px] sm:text-xs text-gray-400">* 실제 취급 시점에 따라 원 단위 오차가 발생할 수 있습니다.</span>
          </div>

          <div class="overflow-y-auto flex-1 table-scrollbar">
            <table class="w-full text-right text-xs sm:text-sm">
              <thead class="bg-slate-100 text-gray-600 font-bold sticky top-0 border-b border-gray-200">
                <tr>
                  <th class="py-2.5 px-2 sm:px-3 text-center">회차</th>
                  <th class="py-2.5 px-2 sm:px-3">상환 원금</th>
                  <th class="py-2.5 px-2 sm:px-3">대출 이자</th>
                  <th class="py-2.5 px-2 sm:px-3 text-mgBlue">월 납입금</th>
                  <th class="py-2.5 px-2 sm:px-3">대출 잔액</th>
                </tr>
              </thead>
              <tbody id="schedule-tbody" class="divide-y divide-gray-100 text-gray-700">
                <!-- Dynamic Rows inserted here -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Elements
    const elAmount = document.getElementById('input-amount');
    const elKoreanAmount = document.getElementById('korean-amount');
    
    const elTerm = document.getElementById('input-term');
    const elTermSlider = document.getElementById('slider-term');
    const btnTermMonth = document.getElementById('btn-term-month');
    const btnTermYear = document.getElementById('btn-term-year');
    const elTermUnitLabel = document.getElementById('label-term-unit');

    const elRate = document.getElementById('input-rate');
    const elRateSlider = document.getElementById('slider-rate');

    const elResFirstPayment = document.getElementById('res-first-payment');
    const elResTotalInterest = document.getElementById('res-total-interest');
    const elResTotalPayment = document.getElementById('res-total-payment');
    const elScheduleTbody = document.getElementById('schedule-tbody');
    const elRepayDesc = document.getElementById('repay-desc');

    // State Variables
    let currentTermUnit = 'year'; // 'year' or 'month'
    let currentRepayType = 'equal-pi'; // 'equal-pi', 'equal-p', 'bullet'

    const repayDescriptions = {
      'equal-pi': '매월 원금과 이자의 합계액을 동일하게 상환하는 방식입니다.',
      'equal-p': '매월 동일한 원금을 상환하며, 잔액에 대한 이자가 차감되어 납입금이 줄어듭니다.',
      'bullet': '대출 기간 동안 이자만 납부하다가 만기 시 원금 전체를 일시 상환합니다.'
    };

    // Number Formatting Helpers
    function formatCurrency(val) {
      return Math.round(val).toLocaleString('ko-KR') + ' 원';
    }

    function updateKoreanAmount() {
      let val = parseFloat(elAmount.value) || 0;
      if (val <= 0) {
        elKoreanAmount.textContent = '0 원';
        return;
      }
      
      let uk = Math.floor(val / 10000);
      let man = val % 10000;
      let result = '';

      if (uk > 0) result += `${uk}억 `;
      if (man > 0) result += `${man.toLocaleString()}만 `;
      result += '원';

      elKoreanAmount.textContent = result;
    }

    /* -------------------------------------
     * 완벽한 초기화 및 원터치 버튼 로직 픽스
     * ------------------------------------- */

    // [수정됨] 대출 금액 변경 (누계 방식 제거, 클릭한 금액으로 바로 세팅)
    function setQuickAmount(val) {
      elAmount.value = val;
      updateKoreanAmount();
      calculate();
    }

    // [픽스 1] 대출 금액 완전 초기화 
    function resetAmount() {
      elAmount.value = 0; // 누적되지 않고 깔끔하게 0원으로 비움
      updateKoreanAmount();
      calculate();
    }

    // [픽스 2] 대출 기간 버튼 클릭 시
    function setQuickTerm(years) {
      if (currentTermUnit === 'month') {
        elTerm.value = years * 12; // 현재 개월 모드면 개월수로 변경
      } else {
        elTerm.value = years; // 년 모드면 년수로 변경
      }
      elTermSlider.value = elTerm.value;
      calculate();
    }

    // [픽스 3] 연 이자율 버튼 클릭 시 
    function setQuickRate(rate) {
      elRate.value = rate; // 누적되지 않고 입력값 자체가 정확히 변경됨
      elRateSlider.value = rate;
      calculate();
    }

    // [픽스 4] 화면 전체 리셋 (전체 조건 초기화)
    function resetAll() {
      // 1. 금액 초기화
      elAmount.value = 500;
      updateKoreanAmount();

      // 2. 단위 및 기간 초기화 (2년으로)
      currentTermUnit = 'year';
      btnTermYear.className = 'px-3 py-1 bg-mgBlue text-white';
      btnTermMonth.className = 'px-3 py-1 bg-white text-gray-600 hover:bg-gray-50';
      elTermUnitLabel.textContent = '년';
      
      elTermSlider.min = 1;
      elTermSlider.max = 50;
      elTerm.value = 2;
      elTermSlider.value = 2;

      // 3. 금리 초기화
      elRate.value = 5.5;
      elRateSlider.value = 5.5;

      // 4. 상환 방식 초기화
      setRepayType('equal-pi');
    }

    // [픽스 5] 기간 단위 변환 시 누계되는 버그 픽스
    function setTermUnit(unit) {
      if (currentTermUnit === unit) return;

      let val = parseFloat(elTerm.value) || 1;

      if (unit === 'year') {
        // 개월 -> 년으로 변환 (24개월 -> 2년)
        currentTermUnit = 'year';
        btnTermYear.className = 'px-3 py-1 bg-mgBlue text-white';
        btnTermMonth.className = 'px-3 py-1 bg-white text-gray-600 hover:bg-gray-50';
        elTermUnitLabel.textContent = '년';

        val = Math.max(1, Math.round(val / 12));
        elTermSlider.min = 1;
        elTermSlider.max = 50;
      } else {
        // 년 -> 개월로 변환 (2년 -> 24개월)
        currentTermUnit = 'month';
        btnTermMonth.className = 'px-3 py-1 bg-mgBlue text-white';
        btnTermYear.className = 'px-3 py-1 bg-white text-gray-600 hover:bg-gray-50';
        elTermUnitLabel.textContent = '개월';

        val = Math.max(1, val * 12);
        elTermSlider.min = 1;
        elTermSlider.max = 600;
      }
      
      elTerm.value = val;
      elTermSlider.value = val;
      calculate();
    }

    // 상환 방식 설정
    function setRepayType(type) {
      currentRepayType = type;
      const types = ['equal-pi', 'equal-p', 'bullet'];
      
      types.forEach(t => {
        const btn = document.getElementById(`type-${t}`);
        if (t === type) {
          btn.className = 'py-2.5 px-1 text-xs sm:text-sm font-bold rounded-lg transition-all bg-mgBlue text-white shadow-sm';
        } else {
          btn.className = 'py-2.5 px-1 text-xs sm:text-sm font-bold rounded-lg transition-all text-gray-700 hover:text-gray-900 hover:bg-white shadow-sm';
        }
      });

      elRepayDesc.textContent = repayDescriptions[type];
      calculate();
    }

    // 이벤트 리스너들
    elAmount.addEventListener('input', () => {
      updateKoreanAmount();
      calculate();
    });

    elTerm.addEventListener('input', () => {
      elTermSlider.value = elTerm.value;
      calculate();
    });

    elTermSlider.addEventListener('input', () => {
      elTerm.value = elTermSlider.value;
      calculate();
    });

    elRate.addEventListener('input', () => {
      elRateSlider.value = elRate.value;
      calculate();
    });

    elRateSlider.addEventListener('input', () => {
      elRate.value = elRateSlider.value;
      calculate();
    });

    // 메인 계산 로직
    function calculate() {
      const amountWan = parseFloat(elAmount.value) || 0;
      const principal = amountWan * 10000; // 만원 -> 원
      const termVal = parseFloat(elTerm.value) || 1;
      const annualRate = parseFloat(elRate.value) || 0;

      if (principal <= 0 || termVal <= 0) {
        elResFirstPayment.textContent = '0 원';
        elResTotalInterest.textContent = '0 원';
        elResTotalPayment.textContent = '0 원';
        elScheduleTbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-400">올바른 대출 조건값을 입력해 주세요.</td></tr>';
        return;
      }

      const totalMonths = currentTermUnit === 'year' ? termVal * 12 : termVal;
      const monthlyRate = (annualRate / 100) / 12;

      let schedule = [];
      let balance = principal;
      let totalInterest = 0;

      if (currentRepayType === 'equal-pi') {
        let monthlyPayment = 0;
        if (monthlyRate === 0) {
          monthlyPayment = principal / totalMonths;
        } else {
          monthlyPayment = (principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
        }

        for (let i = 1; i <= totalMonths; i++) {
          let interest = balance * monthlyRate;
          let principalPayment = monthlyPayment - interest;

          if (i === totalMonths) {
            principalPayment = balance; 
            monthlyPayment = principalPayment + interest;
          }

          balance -= principalPayment;
          totalInterest += interest;

          schedule.push({
            month: i,
            principal: principalPayment,
            interest: interest,
            payment: principalPayment + interest,
            balance: Math.max(0, balance)
          });
        }
      } else if (currentRepayType === 'equal-p') {
        const fixedPrincipalPayment = principal / totalMonths;

        for (let i = 1; i <= totalMonths; i++) {
          let interest = balance * monthlyRate;
          let principalPayment = fixedPrincipalPayment;

          if (i === totalMonths) {
            principalPayment = balance;
          }

          balance -= principalPayment;
          totalInterest += interest;

          schedule.push({
            month: i,
            principal: principalPayment,
            interest: interest,
            payment: principalPayment + interest,
            balance: Math.max(0, balance)
          });
        }
      } else if (currentRepayType === 'bullet') {
        const monthlyInterest = principal * monthlyRate;

        for (let i = 1; i <= totalMonths; i++) {
          let principalPayment = (i === totalMonths) ? principal : 0;
          let interest = monthlyInterest;

          balance -= principalPayment;
          totalInterest += interest;

          schedule.push({
            month: i,
            principal: principalPayment,
            interest: interest,
            payment: principalPayment + interest,
            balance: Math.max(0, balance)
          });
        }
      }

      // 화면에 결과 랜더링
      elResFirstPayment.textContent = formatCurrency(schedule[0].payment);
      elResTotalInterest.textContent = formatCurrency(totalInterest);
      elResTotalPayment.textContent = formatCurrency(principal + totalInterest);

      let tableHtml = '';
      schedule.forEach((row, idx) => {
        tableHtml += `
          <tr class="hover:bg-blue-50/50 transition-colors">
            <td class="py-2.5 px-2 sm:px-3 text-center font-medium text-gray-500">${row.month}회</td>
            <td class="py-2.5 px-2 sm:px-3">${formatCurrency(row.principal)}</td>
            <td class="py-2.5 px-2 sm:px-3 text-red-500">${formatCurrency(row.interest)}</td>
            <td class="py-2.5 px-2 sm:px-3 font-bold text-mgBlue">${formatCurrency(row.payment)}</td>
            <td class="py-2.5 px-2 sm:px-3 text-gray-500">${formatCurrency(row.balance)}</td>
          </tr>
        `;
      });
      elScheduleTbody.innerHTML = tableHtml;
    }

    // 최초 로드 시 실행
    window.onload = function() {
      updateKoreanAmount();
      calculate();
    };
  </script>
</body>
</html>
